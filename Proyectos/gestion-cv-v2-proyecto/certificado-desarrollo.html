<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Certificado Desarrollo Web</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Marco del certificado */
.certificado{
    background: white;
    border: 10px solid #2c3e50;
    padding: 40px;
    width: 700px;
    text-align: center;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
}

.certificado h1{
    font-size: 40px;
    margin-bottom: 10px;
}

.certificado h2{
    color: #2c3e50;
    margin-bottom: 20px;
}

.nombre{
    font-size: 28px;
    font-weight: bold;
    margin: 20px 0;
}

.descripcion{
    font-size: 18px;
    margin: 20px 0;
}

.firma{
    margin-top: 50px;
    display: flex;
    justify-content: space-around;
}

.linea{
    border-top: 2px solid black;
    width: 200px;
    margin: auto;
    padding-top: 5px;
}
</style>

</head>
<body>

<div class="certificado">

    <h1>CERTIFICADO</h1>
    <h2>De Finalización</h2>

    <p>Se otorga el presente certificado a:</p>

    <div class="nombre">
        Ana Vera Martínez
    </div>

    <p class="descripcion">
        Por haber completado satisfactoriamente el curso de
        <strong>Desarrollo Web</strong>,
        demostrando conocimientos en HTML, CSS y diseño web.
    </p>

    <p>Fecha: 2026</p>

    <div class="firma">
        <div>
            <div class="linea"></div>
            Instructor
        </div>

        <div>
            <div class="linea"></div>
            Dirección Académica
        </div>
    </div>

</div>

</body>
</html>
